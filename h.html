<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>EZ3D Online</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        #hud {
            position: fixed;
            top: 15px;
            left: 15px;
            color: white;
            z-index: 10;
            user-select: none;
            line-height: 1.6;
        }

        #leaderboard {
            position: fixed;
            top: 15px;
            right: 15px;
            width: 220px;
            padding: 12px;
            background: rgba(0, 0, 0, .6);
            color: white;
            border-radius: 8px;
            z-index: 10;
        }

        #scores {
            margin-top: 8px;
            line-height: 1.5;
        }

        #crosshair {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 12px;
            height: 12px;
            margin-left: -6px;
            margin-top: -6px;
            z-index: 10;
            pointer-events: none;
        }

        #crosshair::before,
        #crosshair::after {
            content: "";
            position: absolute;
            background: white;
        }

        #crosshair::before {
            width: 12px;
            height: 2px;
            left: 0;
            top: 5px;
        }

        #crosshair::after {
            width: 2px;
            height: 12px;
            left: 5px;
            top: 0;
        }

        #status {
            color: #8ff;
        }
    </style>
</head>

<body>

    <div id="hud">
        <div id="status">서버 연결 중...</div>
        <div id="hp">HP: 100</div>
        <div id="score">K: 0 / D: 0</div>
        <div>WASD 이동 · SPACE 점프 · E 연사</div>
    </div>

    <div id="leaderboard">
        <b>LEADERBOARD</b>
        <div id="scores"></div>
    </div>

    <div id="crosshair"></div>

    <script type="module">

        import {
            WORLD,
            GEO,
            LIGHT,
            INPUT,
            TIME
        } from './ez3d.js';

        import { stepPlayer } from './physics.js';

        // ============================================================
        // 초기화
        // ============================================================

        WORLD.init();
        INPUT.init();


        // ============================================================
        // 맵
        // ============================================================

        const ground = GEO.make(
            "ground",
            0,
            0,
            0,
            false,
            0x555555
        );

        ground.scale.set(20, 20, 20);

        // 조명
        LIGHT.ambient(0.5);

        LIGHT.sun(
            1.2,
            8,
            12,
            6,
            0xfff4e0
        );


        // ============================================================
        // 총알 상수
        // ============================================================

        const BULLET_SPEED = 45;
        const SHOOT_COOLDOWN = 0.08;
        let lastShootTime = 0;


        // ============================================================
        // WebSocket
        // ============================================================

        const socket = new WebSocket(
            `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}`
        );

        let myId = null;

        const players = new Map();

        // 내 캐릭터의 예측 상태
        let predicted = null;
        let inputSeq = 0;
        let inputHistory = [];
        const FIXED_DT = 1 / 60;
        let accumulator = 0;

        // 로컬 총알 (내가 쏜 것)
        const localBullets = [];
        let localBulletId = 0;

        // 서버 총알 (상대방이 쏜 것)
        const bulletMeshMap = new Map();

        // 폭발 파티클
        const explosions = [];


        // ============================================================
        // 플레이어
        // ============================================================

        function createPlayer(id) {
            const color = (id === myId) ? 0x3388ff : 0xff3333;

            const mesh = GEO.make(
                "cube",
                0,
                0.5,
                0,
                true,
                color
            );

            mesh.scale.set(1, 1, 1);

            return {
                id,
                mesh,
                target: { x: 0, y: 0.5, z: 0 },
                targetYaw: 0,
                isDead: false  // 죽음 상태 플래그
            };
        }


        // ============================================================
        // ✨ 폭발 이펙트
        // ============================================================

        function createExplosion(x, y, z, count = 30) {
            const particles = [];
            const colors = [0xff4400, 0xff8800, 0xffcc00, 0xff2200];

            for (let i = 0; i < count; i++) {
                const size = 0.05 + Math.random() * 0.15;
                const mesh = GEO.make(
                    "sphere",
                    x + (Math.random() - 0.5) * 0.3,
                    y + (Math.random() - 0.5) * 0.3,
                    z + (Math.random() - 0.5) * 0.3,
                    false,
                    colors[Math.floor(Math.random() * colors.length)]
                );
                mesh.scale.set(size, size, size);

                const speed = 3 + Math.random() * 7;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;

                particles.push({
                    mesh,
                    vx: Math.sin(theta) * Math.cos(phi) * speed,
                    vy: Math.sin(phi) * speed * 0.5 + 2,
                    vz: Math.cos(theta) * Math.cos(phi) * speed,
                    life: 0.5 + Math.random() * 0.8,
                    maxLife: 0.5 + Math.random() * 0.8
                });
            }

            explosions.push({
                particles,
                active: true
            });
        }


        // ============================================================
        // ✨ 폭발 업데이트
        // ============================================================

        function updateExplosions(dt) {
            for (let e = explosions.length - 1; e >= 0; e--) {
                const exp = explosions[e];
                let allDead = true;

                for (let i = exp.particles.length - 1; i >= 0; i--) {
                    const p = exp.particles[i];
                    p.life -= dt;

                    if (p.life <= 0) {
                        GEO.remove(p.mesh);
                        exp.particles.splice(i, 1);
                        continue;
                    }

                    allDead = false;

                    // 중력 적용
                    p.vy -= 15 * dt;
                    p.mesh.position.x += p.vx * dt;
                    p.mesh.position.y += p.vy * dt;
                    p.mesh.position.z += p.vz * dt;

                    // 크기 서서히 줄어들기
                    const scale = (p.life / p.maxLife) * 0.3;
                    p.mesh.scale.set(scale, scale, scale);

                    // 회전
                    p.mesh.rotation.x += dt * 5;
                    p.mesh.rotation.y += dt * 3;
                }

                if (allDead || exp.particles.length === 0) {
                    explosions.splice(e, 1);
                }
            }
        }


        // ============================================================
        // ✨ 총알 발사 (클라이언트 즉시 생성)
        // ============================================================

        function shootBullet() {
            const now = performance.now() / 1000;
            if (now - lastShootTime < SHOOT_COOLDOWN) return;
            lastShootTime = now;

            if (!predicted) return;

            const id = 'local_' + (localBulletId++);
            const mesh = GEO.make('sphere', predicted.x, predicted.y + 0.3, predicted.z, false, 0x3388ff);
            mesh.scale.set(0.2, 0.2, 0.2);

            localBullets.push({
                id,
                mesh,
                x: predicted.x,
                y: predicted.y + 0.3,
                z: predicted.z,
                yaw: yaw,
                life: 1.0
            });
        }


        // ============================================================
        // ✨ 로컬 총알 업데이트 (매 프레임)
        // ============================================================

        function updateLocalBullets(dt) {
            for (let i = localBullets.length - 1; i >= 0; i--) {
                const b = localBullets[i];
                b.x += Math.sin(b.yaw) * BULLET_SPEED * dt;
                b.z += Math.cos(b.yaw) * BULLET_SPEED * dt;
                b.life -= dt;

                b.mesh.position.set(b.x, b.y, b.z);

                if (b.life <= 0 || Math.abs(b.x) > 20 || Math.abs(b.z) > 20) {
                    GEO.remove(b.mesh);
                    localBullets.splice(i, 1);
                }
            }
        }


        // ============================================================
        // ✨ 서버 총알 동기화 (상대방 총알만)
        // ============================================================

        function updateServerBullets(serverBullets) {
            if (!serverBullets) return;

            const activeIds = new Set();

            serverBullets.forEach(b => {
                // 내 총알은 로컬에서 이미 처리했으므로 무시
                if (b.ownerId === myId) return;

                activeIds.add(b.id);
                let mesh = bulletMeshMap.get(b.id);

                if (!mesh) {
                    // 상대방 총알 (빨간색)
                    mesh = GEO.make("sphere", b.x, b.y, b.z, false, 0xff0000);
                    mesh.scale.set(0.2, 0.2, 0.2);
                    bulletMeshMap.set(b.id, mesh);
                } else {
                    mesh.position.set(b.x, b.y, b.z);
                }
            });

            // 서버 목록에서 사라진 상대방 총알 제거
            for (const [id, mesh] of bulletMeshMap.entries()) {
                if (!activeIds.has(id)) {
                    GEO.remove(mesh);
                    bulletMeshMap.delete(id);
                }
            }
        }


        // ============================================================
        // 마우스 시점
        // ============================================================

        let yaw = 0;
        let pitch = 0;

        document.body.addEventListener("click", () => {
            document.body.requestPointerLock();
        });

        document.addEventListener("mousemove", e => {
            if (document.pointerLockElement !== document.body) {
                return;
            }

            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;

            pitch = Math.max(
                -1.3,
                Math.min(1.3, pitch)
            );
        });


        // ============================================================
        // 서버 입력 전송
        // ============================================================

        let jumpRequested = false;

        window.addEventListener("keydown", e => {
            if (e.code === "Space") {
                jumpRequested = true;
            }
        });

        function computeInput() {
            let inputX = 0;
            let inputZ = 0;

            if (INPUT.isDown("KeyW")) inputZ += 1;
            if (INPUT.isDown("KeyS")) inputZ -= 1;
            if (INPUT.isDown("KeyA")) inputX -= 1;
            if (INPUT.isDown("KeyD")) inputX += 1;

            const length = Math.hypot(inputX, inputZ);

            if (length > 0) {
                inputX /= length;
                inputZ /= length;
            }

            const moveX =
                inputZ * Math.sin(yaw) -
                inputX * Math.cos(yaw);

            const moveZ =
                inputZ * Math.cos(yaw) +
                inputX * Math.sin(yaw);

            const input = {
                moveX,
                moveZ,
                jump: jumpRequested,
                shoot: INPUT.isDown("KeyE"),
                yaw
            };

            // 클라이언트 즉시 발사 (서버에도 전송되지만, 여기서 미리 생성)
            if (input.shoot) {
                shootBullet();
            }

            jumpRequested = false;

            return input;
        }

        function sendInput(input, seq) {
            if (socket.readyState !== WebSocket.OPEN) {
                return;
            }

            socket.send(JSON.stringify({
                type: "input",
                seq,
                ...input
            }));
        }


        // ============================================================
        // 서버 메시지 수신
        // ============================================================

        socket.addEventListener("open", () => {
            document.getElementById("status").textContent = "ONLINE";
        });

        socket.addEventListener("close", () => {
            document.getElementById("status").textContent = "DISCONNECTED";
        });

        socket.addEventListener("message", event => {
            const data = JSON.parse(event.data);

            if (data.type === "welcome") {
                myId = data.id;
                return;
            }

            if (data.type === "state") {
                // 1. 플레이어 동기화
                updatePlayers(data.players);

                // 2. ✨ 총알 렌더링 동기화 (상대방 총알만)
                updateServerBullets(data.bullets);

                return;
            }

            if (data.type === "leaderboard") {
                updateLeaderboard(data.leaderboard);
                return;
            }
        });


        // ============================================================
        // 플레이어 동기화
        // ============================================================

        function updatePlayers(list) {
            const alive = new Set();

            for (const p of list) {
                alive.add(p.id);

                let player = players.get(p.id);

                if (!player) {
                    player = createPlayer(p.id);
                    players.set(p.id, player);
                }

                if (p.id === myId) {
                    // 내 HP가 0이면 죽음 처리
                    if (p.hp <= 0 && !player.isDead) {
                        player.isDead = true;
                        // 폭발 이펙트 생성
                        createExplosion(p.x, p.y, p.z, 40);
                        // 캐릭터 메쉬 숨기기
                        player.mesh.visible = false;
                    }

                    // 부활 처리 (HP가 100으로 회복되면)
                    if (p.hp > 0 && player.isDead) {
                        player.isDead = false;
                        player.mesh.visible = true;
                    }

                    if (!predicted) {
                        predicted = {
                            x: p.x,
                            y: p.y,
                            z: p.z,
                            vy: p.vy,
                            isGrounded: p.isGrounded,
                            coyoteTimer: p.coyoteTimer || 0,
                            jumpBufferTimer: p.jumpBufferTimer || 0
                        };
                    } else if (typeof p.lastProcessedSeq === 'number') {
                        inputHistory = inputHistory.filter(
                            entry => entry.seq > p.lastProcessedSeq
                        );

                        predicted.x = p.x;
                        predicted.y = p.y;
                        predicted.z = p.z;
                        predicted.vy = p.vy;
                        predicted.isGrounded = p.isGrounded;
                        predicted.coyoteTimer = p.coyoteTimer || 0;
                        predicted.jumpBufferTimer = p.jumpBufferTimer || 0;

                        for (const entry of inputHistory) {
                            stepPlayer(predicted, entry.input, FIXED_DT);
                        }
                    }

                    player.yaw = yaw;

                    document.getElementById("hp").textContent = `HP: ${p.hp}`;
                    document.getElementById("score").textContent = `K: ${p.kills} / D: ${p.deaths}`;
                } else {
                    // 상대방이 죽었는지 확인
                    if (p.hp <= 0 && !player.isDead) {
                        player.isDead = true;
                        createExplosion(p.x, p.y, p.z, 30);
                        player.mesh.visible = false;
                    }

                    if (p.hp > 0 && player.isDead) {
                        player.isDead = false;
                        player.mesh.visible = true;
                    }

                    player.target.x = p.x;
                    player.target.y = p.y;
                    player.target.z = p.z;
                    player.targetYaw = p.yaw;
                }
            }

            // 퇴장 플레이어 삭제
            for (const [id, player] of players) {
                if (!alive.has(id)) {
                    GEO.remove(player.mesh);
                    players.delete(id);
                }
            }
        }


        // ============================================================
        // 프레임 업데이트 / 보간 처리
        // ============================================================

        function updateLocalPrediction(dt) {
            if (!predicted) return;

            accumulator += dt;
            accumulator = Math.min(accumulator, FIXED_DT * 5);

            while (accumulator >= FIXED_DT) {
                const input = computeInput();
                inputSeq++;

                stepPlayer(predicted, input, FIXED_DT);

                inputHistory.push({ seq: inputSeq, input });

                sendInput(input, inputSeq);

                accumulator -= FIXED_DT;
            }

            const me = players.get(myId);
            if (!me) return;

            // 죽었으면 위치 업데이트 안 함 (폭발 파티클이 대신 표시)
            if (!me.isDead) {
                me.mesh.position.set(
                    predicted.x,
                    predicted.y,
                    predicted.z
                );
            }

            me.mesh.rotation.y = yaw;
            me.yaw = yaw;

            const distance = 8;

            const camX = predicted.x - Math.sin(yaw) * distance;
            const camZ = predicted.z - Math.cos(yaw) * distance;
            const camY = predicted.y + 4 + pitch * 2;

            WORLD.camera.position.set(camX, camY, camZ);
            WORLD.camera.lookAt(predicted.x, predicted.y + 0.5, predicted.z);
        }

        function updateRemoteInterpolation(dt) {
            const lerpFactor = Math.min(1, dt * 12);

            for (const [id, player] of players) {
                if (id === myId) continue;

                // 죽었으면 위치 업데이트 안 함
                if (!player.isDead) {
                    player.mesh.position.x += (player.target.x - player.mesh.position.x) * lerpFactor;
                    player.mesh.position.y += (player.target.y - player.mesh.position.y) * lerpFactor;
                    player.mesh.position.z += (player.target.z - player.mesh.position.z) * lerpFactor;
                }

                player.mesh.rotation.y = player.targetYaw;
            }
        }


        // ============================================================
        // 리더보드
        // ============================================================

        function updateLeaderboard(list) {
            const element = document.getElementById("scores");
            element.innerHTML = "";

            for (let i = 0; i < list.length; i++) {
                const p = list[i];
                const row = document.createElement("div");

                const name = p.id === myId ? `${p.id} (YOU)` : p.id;
                row.textContent = `${i + 1}. ${name} — ${p.kills} K`;

                element.appendChild(row);
            }
        }


        // ============================================================
        // 게임 루프
        // ============================================================

        WORLD.animate((dt) => {
            updateLocalPrediction(dt);
            updateRemoteInterpolation(dt);
            updateLocalBullets(dt);
            updateExplosions(dt);  // ← 폭발 이펙트 업데이트
        });

    </script>

</body>

</html>

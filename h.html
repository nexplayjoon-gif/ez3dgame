<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>EZ3D Online</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        #hud {
            position: fixed;
            top: 15px;
            left: 15px;
            color: white;
            z-index: 10;
            user-select: none;
            line-height: 1.6;
        }

        #leaderboard {
            position: fixed;
            top: 15px;
            right: 15px;
            width: 220px;
            padding: 12px;
            background: rgba(0, 0, 0, .6);
            color: white;
            border-radius: 8px;
            z-index: 10;
        }

        #scores {
            margin-top: 8px;
            line-height: 1.5;
        }

        #crosshair {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 12px;
            height: 12px;
            margin-left: -6px;
            margin-top: -6px;
            z-index: 10;
            pointer-events: none;
        }

        #crosshair::before,
        #crosshair::after {
            content: "";
            position: absolute;
            background: white;
        }

        #crosshair::before {
            width: 12px;
            height: 2px;
            left: 0;
            top: 5px;
        }

        #crosshair::after {
            width: 2px;
            height: 12px;
            left: 5px;
            top: 0;
        }

        #status {
            color: #8ff;
        }
    </style>
</head>

<body>

    <div id="hud">
        <div id="status">서버 연결 중...</div>
        <div id="hp">HP: 100</div>
        <div id="score">K: 0 / D: 0</div>
        <div>WASD 이동 · SPACE 점프 · E 연사</div>
    </div>

    <div id="leaderboard">
        <b>LEADERBOARD</b>
        <div id="scores"></div>
    </div>

    <div id="crosshair"></div>

    <script type="module">

        import {
            WORLD,
            GEO,
            LIGHT,
            INPUT,
            TIME
        } from './ez3d.js';

        import { PHYSICS, stepPlayer } from './physics.js';

        // ============================================================
        // 초기화
        // ============================================================

        WORLD.init();
        INPUT.init();


        // ============================================================
        // 맵
        // ============================================================

        const ground = GEO.make(
            "ground",
            0,
            0,
            0,
            false,
            0x555555
        );

        // EZ3D 기본 ground = 20x20
        // 2배로 확대해서 40x40 필드
        ground.scale.set(2, 2, 2);


        // 조명
        LIGHT.ambient(0.5);

        LIGHT.sun(
            1.2,
            8,
            12,
            6,
            0xfff4e0
        );


        // ============================================================
        // WebSocket
        // ============================================================

        const socket = new WebSocket(
            `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}`
        );

        let myId = null;

        const players = new Map();

        // 내 캐릭터의 "예측" 상태 — 서버 응답을 기다리지 않고
        // 매 프레임 로컬에서 먼저 이동시켜서 화면에 반영하는 값.
        // 서버 state가 도착하면 이 값을 서버 값과 비교해서 보정한다.
        let predicted = null;
        const RECONCILE_SNAP_DIST = 2.0; // 이 이상 어긋나면 순간 보정(스냅)
        const RECONCILE_SMOOTH = 0.2;    // 작은 오차는 이 비율로 서서히 보정


        // ============================================================
        // 플레이어
        // ============================================================

        function createPlayer(id) {

            const mesh = GEO.make(
                "cube",
                0,
                0.5,
                0,
                true,
                0x3388ff
            );

            mesh.scale.set(1, 1, 1);

            return {
                id,
                mesh,
                target: { x: 0, y: 0.5, z: 0 }, // 서버가 준 최신 목표 위치
                targetYaw: 0
            };
        }


        // ============================================================
        // 총알 시각 효과
        // ============================================================

        const bullets = [];

        function createBullet(player) {

            const mesh = GEO.make(
                "cube",
                player.mesh.position.x,
                player.mesh.position.y,
                player.mesh.position.z,
                false,
                0xffff00
            );

            mesh.scale.set(
                0.08,
                0.08,
                1
            );

            mesh.rotation.y = player.yaw;

            bullets.push({
                mesh,

                x: player.mesh.position.x,
                y: player.mesh.position.y,
                z: player.mesh.position.z,

                yaw: player.yaw,

                life: 1.0
            });
        }


        // ============================================================
        // 마우스 시점
        // ============================================================

        let yaw = 0;
        let pitch = 0;

        document.body.addEventListener("click", () => {
            document.body.requestPointerLock();
        });

        document.addEventListener("mousemove", e => {

            if (document.pointerLockElement !== document.body) {
                return;
            }

            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;

            pitch = Math.max(
                -1.3,
                Math.min(1.3, pitch)
            );
        });


        // ============================================================
        // 서버 입력 전송
        // ============================================================

        let jumpRequested = false;

        window.addEventListener("keydown", e => {

            if (e.code === "Space") {
                jumpRequested = true;
            }

        });

        function computeInput() {
            let inputX = 0;
            let inputZ = 0;

            if (INPUT.isDown("KeyW")) inputZ += 1;
            if (INPUT.isDown("KeyS")) inputZ -= 1;
            if (INPUT.isDown("KeyA")) inputX -= 1;
            if (INPUT.isDown("KeyD")) inputX += 1;

            const length = Math.hypot(inputX, inputZ);

            if (length > 0) {
                inputX /= length;
                inputZ /= length;
            }

            // 전방 = (sin(yaw), cos(yaw))  ← 총알/카메라와 동일한 기준
            // 오른쪽 = (-cos(yaw), sin(yaw))
            // W(전진)는 전방 벡터, D(오른쪽)는 오른쪽 벡터를 따라가도록 합성
            const moveX =
                inputZ * Math.sin(yaw) -
                inputX * Math.cos(yaw);

            const moveZ =
                inputZ * Math.cos(yaw) +
                inputX * Math.sin(yaw);

            const input = {
                moveX,
                moveZ,
                jump: jumpRequested,
                shoot: INPUT.isDown("KeyE"),
                yaw
            };

            jumpRequested = false;

            return input;
        }

        function sendInput(input) {
            if (socket.readyState !== WebSocket.OPEN) {
                return;
            }

            socket.send(JSON.stringify({
                type: "input",
                ...input
            }));
        }


        // ============================================================
        // 연사
        // ============================================================

        let shootTimer = 0;

        function updateShooting() {

            if (!INPUT.isDown("KeyE")) {
                shootTimer = 0;
                return;
            }

            shootTimer -= TIME.delta;

            if (shootTimer <= 0) {

                shootTimer = 0.08;

                const me = players.get(myId);

                if (me) {
                    me.yaw = yaw;
                    createBullet(me);
                }
            }
        }


        // ============================================================
        // 총알 애니메이션
        // ============================================================

        function updateBullets() {

            for (let i = bullets.length - 1; i >= 0; i--) {

                const bullet = bullets[i];

                const speed = 45;

                bullet.x += Math.sin(bullet.yaw)
                    * speed
                    * TIME.delta;

                bullet.z += Math.cos(bullet.yaw)
                    * speed
                    * TIME.delta;

                bullet.life -= TIME.delta;

                bullet.mesh.position.set(
                    bullet.x,
                    bullet.y,
                    bullet.z
                );

                if (bullet.life <= 0) {

                    GEO.remove(bullet.mesh);

                    bullets.splice(i, 1);
                }
            }
        }


        // ============================================================
        // 서버 메시지
        // ============================================================

        socket.addEventListener("open", () => {

            document.getElementById("status").textContent =
                "ONLINE";

        });


        socket.addEventListener("close", () => {

            document.getElementById("status").textContent =
                "DISCONNECTED";

        });


        socket.addEventListener("message", event => {

            const data = JSON.parse(event.data);


            // 내 ID
            if (data.type === "welcome") {

                myId = data.id;

                return;
            }


            // 플레이어 상태
            if (data.type === "state") {

                updatePlayers(data.players);

                return;
            }


            // 리더보드
            if (data.type === "leaderboard") {

                updateLeaderboard(data.leaderboard);

                return;
            }

        });


        // ============================================================
        // 플레이어 동기화
        // ============================================================

        function updatePlayers(list) {

            const alive = new Set();

            for (const p of list) {

                alive.add(p.id);

                let player = players.get(p.id);

                if (!player) {

                    player = createPlayer(p.id);

                    players.set(
                        p.id,
                        player
                    );
                }


                if (p.id === myId) {

                    // ------------------------------------------------
                    // 내 캐릭터: 예측(predicted)이 아직 없으면 서버 값으로 초기화.
                    // 있으면 즉시 스냅하지 않고 서버 값과의 오차만큼만 보정한다.
                    // (너무 자주/세게 보정하면 예측한 의미가 없어짐)
                    // ------------------------------------------------
                    if (!predicted) {

                        predicted = {
                            x: p.x,
                            y: p.y,
                            z: p.z,
                            vy: p.vy,
                            isGrounded: p.isGrounded
                        };

                    } else {

                        const dist = Math.hypot(
                            p.x - predicted.x,
                            p.z - predicted.z
                        );

                        if (dist > RECONCILE_SNAP_DIST) {
                            // 오차가 너무 크면(피격 리스폰 등) 바로 스냅
                            predicted.x = p.x;
                            predicted.z = p.z;
                        } else {
                            // 오차가 작으면 서서히 당겨서 보정 (티 안 나게)
                            predicted.x += (p.x - predicted.x) * RECONCILE_SMOOTH;
                            predicted.z += (p.z - predicted.z) * RECONCILE_SMOOTH;
                        }

                        // 수직 이동(점프/중력)은 서버가 권위자이므로 그대로 따름
                        predicted.y = p.y;
                        predicted.vy = p.vy;
                        predicted.isGrounded = p.isGrounded;
                    }

                    player.yaw = yaw;

                    document.getElementById("hp").textContent =
                        `HP: ${p.hp}`;

                    document.getElementById("score").textContent =
                        `K: ${p.kills} / D: ${p.deaths}`;

                } else {

                    // ------------------------------------------------
                    // 다른 플레이어: 위치를 바로 스냅하지 않고
                    // target에 저장해서 매 프레임 부드럽게 따라가게 한다.
                    // ------------------------------------------------
                    player.target.x = p.x;
                    player.target.y = p.y;
                    player.target.z = p.z;
                    player.targetYaw = p.yaw;
                }
            }


            // 나간 플레이어 삭제
            for (const [id, player] of players) {

                if (!alive.has(id)) {

                    GEO.remove(
                        player.mesh
                    );

                    players.delete(id);
                }
            }
        }


        // ============================================================
        // 다른 플레이어 위치 보간 + 내 캐릭터 예측 이동/렌더링 (매 프레임)
        // ============================================================

        function updateLocalPrediction(dt) {

            if (!predicted) return;

            const input = computeInput();

            sendInput(input);

            stepPlayer(predicted, input, dt);

            const me = players.get(myId);

            if (!me) return;

            me.mesh.position.set(
                predicted.x,
                predicted.y,
                predicted.z
            );

            me.mesh.rotation.y = yaw;
            me.yaw = yaw;

            // 3인칭 카메라 (예측 위치를 즉시 따라가서 지연 없음)
            const distance = 8;

            const camX = predicted.x - Math.sin(yaw) * distance;
            const camZ = predicted.z - Math.cos(yaw) * distance;
            const camY = predicted.y + 4 + pitch * 2;

            WORLD.camera.position.set(camX, camY, camZ);
            WORLD.camera.lookAt(predicted.x, predicted.y + 0.5, predicted.z);
        }

        function updateRemoteInterpolation(dt) {

            const lerpFactor = Math.min(1, dt * 12);

            for (const [id, player] of players) {

                if (id === myId) continue;

                player.mesh.position.x += (player.target.x - player.mesh.position.x) * lerpFactor;
                player.mesh.position.y += (player.target.y - player.mesh.position.y) * lerpFactor;
                player.mesh.position.z += (player.target.z - player.mesh.position.z) * lerpFactor;

                player.mesh.rotation.y = player.targetYaw;
            }
        }


        // ============================================================
        // 리더보드
        // ============================================================

        function updateLeaderboard(list) {

            const element =
                document.getElementById("scores");

            element.innerHTML = "";

            for (let i = 0; i < list.length; i++) {

                const p = list[i];

                const row =
                    document.createElement("div");

                const name =
                    p.id === myId
                        ? `${p.id} (YOU)`
                        : p.id;

                row.textContent =
                    `${i + 1}. ${name} — ${p.kills} K`;

                element.appendChild(row);
            }
        }


        // ============================================================
        // 게임 루프
        // ============================================================

        WORLD.animate((dt) => {

            updateLocalPrediction(dt);

            updateRemoteInterpolation(dt);

            updateShooting();

            updateBullets();

        });

    </script>

</body>

</html>
